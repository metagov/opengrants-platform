services:
  postgres:
    container_name: postgres
    image: postgres:16
    restart: always
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: opengrants

  dagster:
    container_name: dagster
    build:
      context: .
      dockerfile: og_dagster/Dockerfile
    restart: always
    depends_on:
      - postgres
    ports:
      - '3000:3000'
    volumes:
      - ./og_dagster:/app
      - ./duckdb:/data/duckdb
    environment:
      - DAGSTER_HOME=/app
      - DUCKDB_CACHE_PATH=/app/duckdb/data/local.duckdb
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-opengrants}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    env_file:
      - .env

  dlt:
    container_name: dlt
    build: ./dlt_pipelines
    restart: on-failure
    depends_on:
      - postgres
    volumes:
      - ./dlt_pipelines:/app
      - ./duckdb:/data/duckdb
    env_file:
      - .env
    command:
      - python
      - loaders/sample_loader.py

  dbt:
    container_name: dbt
    build:
      context: .
      dockerfile: dbt_project/Dockerfile
    restart: on-failure
    depends_on:
      - postgres
    volumes:
      - ./dbt_project:/app
      - ./duckdb:/data/duckdb
    env_file:
      - .env
    entrypoint:
      - dbt
    working_dir: /app

volumes:
  postgres_data: null
  duckdb:
    driver: local
