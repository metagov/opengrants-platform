version: 2

models:
  - name: gold__grantsstack_system_profile
    description: "Platform-wide aggregated metrics for Gitcoin Grants Stack"
    columns:
      - name: platform
        description: "Platform identifier"
        data_tests:
          - not_null
          - accepted_values:
              values: ['grantsstack']
      - name: total_grant_pools
        description: "Total number of grant rounds"
        data_tests:
          - not_null
      - name: total_projects
        description: "Total registered projects"
        data_tests:
          - not_null
      - name: total_applications
        description: "Total applications submitted"
        data_tests:
          - not_null
      - name: total_donations
        description: "Total donations made"
        data_tests:
          - not_null
      - name: unique_donors
        description: "Unique donor addresses"
        data_tests:
          - not_null
      - name: total_donated_usd
        description: "Total donated in USD"
        data_tests:
          - not_null
      - name: calculated_at
        description: "Timestamp when metrics were calculated"
        data_tests:
          - not_null

  - name: gold__grantsstack_round_metrics
    description: "Per-round analytics with funding and participation data"
    columns:
      - name: round_id
        description: "Unique identifier for the grant round"
        data_tests:
          - not_null
          - unique
      - name: round_name
        description: "Display name of the round"
      - name: funding_mechanism
        description: "Type of funding mechanism used"
        data_tests:
          - accepted_values:
              values: ['Quadratic Funding', 'Direct Grants', 'Retroactive Funding', null]
      - name: chain_id
        description: "Blockchain chain ID"
        data_tests:
          - not_null
      - name: matching_pool_usd
        description: "Matching pool size in USD"
        data_tests:
          - not_null
      - name: total_applications
        description: "Number of applications to this round"
        data_tests:
          - not_null
      - name: approved_applications
        description: "Number of approved applications"
        data_tests:
          - not_null
      - name: approval_rate_pct
        description: "Percentage of applications approved"
        data_tests:
          - not_null

  - name: gold__grantsstack_chain_metrics
    description: "Per-chain analytics for multi-chain deployment"
    columns:
      - name: platform
        description: "Platform identifier"
        data_tests:
          - not_null
          - accepted_values:
              values: ['grantsstack']
      - name: chain_id
        description: "Blockchain chain ID"
        data_tests:
          - not_null
          - unique
      - name: chain_name
        description: "Human-readable chain name"
        data_tests:
          - not_null
      - name: round_count
        description: "Number of rounds on this chain"
        data_tests:
          - not_null
      - name: total_matching_pool_usd
        description: "Total matching funds on this chain"
        data_tests:
          - not_null
      - name: donation_volume_usd
        description: "Total donation volume on this chain"
        data_tests:
          - not_null
      - name: total_funding_volume_usd
        description: "Total funding volume (donations + matching)"
        data_tests:
          - not_null

  - name: gold__grantsstack_donation_metrics
    description: "Detailed donation analytics and donor engagement metrics"
    columns:
      - name: platform
        description: "Platform identifier"
        data_tests:
          - not_null
          - accepted_values:
              values: ['grantsstack']
      - name: total_donations
        description: "Total number of donations"
        data_tests:
          - not_null
      - name: total_donated_usd
        description: "Total amount donated in USD"
        data_tests:
          - not_null
      - name: unique_donors
        description: "Number of unique donor addresses"
        data_tests:
          - not_null
      - name: avg_donation_usd
        description: "Average donation size in USD"
        data_tests:
          - not_null
      - name: median_donation_usd
        description: "Median donation size in USD"
        data_tests:
          - not_null
      - name: one_time_donors
        description: "Donors who donated only once"
        data_tests:
          - not_null
      - name: repeat_donors
        description: "Donors who donated multiple times"
        data_tests:
          - not_null
      - name: repeat_donor_percentage
        description: "Percentage of donors who are repeat donors"
        data_tests:
          - not_null

  - name: gold__grantsstack_payout_metrics
    description: "Tracks matching fund distributions to projects"
    columns:
      - name: platform
        description: "Platform identifier"
        data_tests:
          - not_null
          - accepted_values:
              values: ['grantsstack']
      - name: total_payouts
        description: "Total number of payout transactions"
        data_tests:
          - not_null
      - name: total_paid_usd
        description: "Total amount paid out in USD"
        data_tests:
          - not_null
      - name: applications_paid
        description: "Number of applications that received payouts"
        data_tests:
          - not_null
      - name: avg_payout_usd
        description: "Average payout size in USD"
        data_tests:
          - not_null
      - name: median_payout_usd
        description: "Median payout size in USD"
        data_tests:
          - not_null
      - name: matching_distribution_rate_pct
        description: "Percentage of matching pool distributed"
        data_tests:
          - not_null


sources:
  - name: silver
    description: "Silver layer tables for GrantStack data"
    schema: public
    tables:
      - name: silver_grantsstack_grant_pools
        description: "DAOIP-5 compliant grant pool (round) data"
        columns:
          - name: id
            description: "Unique grant pool identifier"
            data_tests:
              - not_null
              - unique
          - name: name
            description: "Grant pool name"
            data_tests:
              - not_null
          - name: grantFundingMechanism
            description: "Type of funding mechanism"
          - name: totalGrantPoolSizeInUSD
            description: "Total pool size in USD"

      - name: silver_grantsstack_projects
        description: "DAOIP-5 compliant project data"
        columns:
          - name: id
            description: "Unique project identifier"
            data_tests:
              - not_null
              - unique
          - name: name
            description: "Project name"
            data_tests:
              - not_null

      - name: silver_grantsstack_grant_applications
        description: "DAOIP-5 compliant grant application data"
        columns:
          - name: id
            description: "Unique application identifier"
            data_tests:
              - not_null
              - unique
          - name: status
            description: "Application status"
            data_tests:
              - not_null
              - accepted_values:
                  values: ['pending', 'in_review', 'approved', 'funded', 'rejected', 'completed']

      - name: silver_grantsstack_donations
        description: "Individual donation records"
        columns:
          - name: id
            description: "Unique donation identifier"
            data_tests:
              - not_null
              - unique
          - name: donorAddress
            description: "Donor wallet address"
            data_tests:
              - not_null
          - name: amountInUsd
            description: "Donation amount in USD"

      - name: silver_grantsstack_payouts
        description: "Payout transaction records"
        columns:
          - name: id
            description: "Unique payout identifier"
            data_tests:
              - not_null
              - unique
          - name: amountInUsd
            description: "Payout amount in USD"
