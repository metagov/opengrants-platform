# ============================================================
# DAOIP-5 Unified Schema Map — Privote (GG24 Privacy Round)
# ============================================================

manifest:
  schema_name: daoip5_privote
  version: 1.3.1
  source_system: "Privote Onchain Registry (Arbitrum)"
  last_updated: "2025-11-06T19:30:00Z"
  description: >
    DAOIP-5 compliant normalization for Privote GG24 Quadratic Funding Round. Three canonical Silver tables: projects, grant_pools, grant_applications. Includes joins/enrichments from all bronze_privote_* tables.

schemas:

  # ------------------------------------------------------------
  # PROJECTS
  # ------------------------------------------------------------
  projects:
    table: public.bronze_privote_recipients
    target_table: silver_privote_projects
    fields:
      id:
        source: id
        type: string
        transform: "lambda v: f'daoip-5:privote:project:{v.lower()}' if v else None"
        required: true
      name:
        source: metadataUrl
        type: string
        transform: "lambda v: v.split('/')[-1] if v else 'unknown'"
        required: true
      description:
        source: null
        type: string
        required: false
      contentURI:
        source: metadataUrl
        type: string
        required: false
      image:
        source: null
        type: string
        required: false
      coverImage:
        source: null
        type: string
        required: true
      email:
        source: null
        type: string
        required: false
      socials:
        source: registry_metadataUrl
        type: json
        transform: "lambda v: [{'platform': 'Privote Registry', 'url': v}] if v else []"
        required: false
      membersURI:
        source: null
        type: string
        required: true
      attestationIssuersURI:
        source: null
        type: json
        transform: "lambda _: []"
        required: true
      relevantTo:
        source: null
        type: json
        transform: "lambda _: []"
        required: true
      licenseURI:
        source: null
        type: string
        required: true

    extensions:
      io.privote:
        registryId:
          source: registry_id
          type: string
        registryPollId:
          source: registry_poll_id
          type: string
        registryPollNumber:
          source: registry_poll_pollId
          type: string
        index:
          source: index
          type: string
        payout:
          source: payout
          type: string
        initialized:
          source: initialized
          type: boolean
        deleted:
          source: deleted
          type: boolean

  # ------------------------------------------------------------
  # GRANT POOLS
  # ------------------------------------------------------------
  grant_pools:
    table: public.bronze_privote_registries
    target_table: silver_privote_grant_pools
    fields:
      id:
        source: id
        type: string
        transform: "lambda v: f'daoip-5:privote:grantPool:{v.lower()}'"
        required: true
      name:
        source: metadataUrl
        type: string
        required: true
      description:
        source: "Quadratic funding pool managed via MACI Privote registry."
        type: string
      applicationsURI:
        source: metadataUrl
        type: string
      totalGrantPoolSizeInUSD:
        source: poll_maxVoteOption
        type: float
        transform: "lambda v: float(v) * 100.0 if v else 500000.0"
        required: true
      totalGrantPoolSize:
        source: poll_maxVoteOption
        type: json
        transform: "lambda v: {'currency': 'USD', 'amount': float(v) * 100.0 if v else 500000.0}"
        required: true
      isOpen:
        source: null
        type: boolean
        transform: "lambda _: False"
      closeDate:
        source: poll_createdAt
        type: datetime
      image:
        source: null
        type: string
        required: true
      coverImage:
        source: null
        type: string
        required: true
      email:
        source: null
        type: string
        required: true
      grantFundingMechanism:
        source: null
        type: enum
        allowed: [ "Quadratic Funding" ]
        transform: "lambda _: 'Quadratic Funding'"
      governanceURI:
        source: null
        type: string
        required: true
      attestationIssuersURI:
        source: null
        type: string
        required: true
      requiredCredentials:
        source: null
        type: json
        transform: "lambda _: ['DAO Attestation']"
        required: true

    extensions:
      io.privote:
        chain:
          source: "arbitrum-one"
          type: string
        pollId:
          source: poll_id
          type: string
        pollDuration:
          source: poll_duration
          type: string
        pollInitTime:
          source: poll_initTime
          type: string
        pollMaci:
          source: poll_maci_id
          type: string
        pollMaciStats:
          source: poll_maci_updatedAt
          type: json
          transform: |
            lambda updated: {
              'stateTreeDepth': None,
              'numPoll': None,
              'numSignUps': None,
              'latestPoll': None,
              'updatedAt': updated
            }
        pollLimits:
          source: poll_maxMessages
          type: json
          transform: |
            lambda v: {'maxMessages': v, 'maxVoteOption': None, 'messageProcessor': None}

  # ------------------------------------------------------------
  # GRANT APPLICATIONS
  # ------------------------------------------------------------
  grant_applications:
    table: public.bronze_privote_claims_enriched
    target_table: silver_privote_grant_applications
    fields:
      id:
        source: id
        type: string
        transform: "lambda v: f'daoip-5:privote:application:{v.lower()}'"
        required: true
      name:
        source: id
        type: string
        required: true
      grantPoolName:
        source: "GG24 Privote Round"
        type: string
        required: true
      discussionTo:
        source: null
        type: string
        required: true
      licenseURI:
        source: null
        type: string
        required: true
      isInactive:
        source: null
        type: boolean
        transform: "lambda _: False"
        required: true
      applicationCompletionRate:
        source: null
        type: float
        transform: "lambda _: 1.0"
        required: true
      description:
        source: null
        type: string
      contentURI:
        source: null
        type: string
        required: true
      projectId:
        source: tally_poll_id
        type: string
        transform: "lambda v: f'daoip-5:privote:project:{v.lower()}' if v else None"
        required: true
      grantPoolId:
        source: tally_poll_pollId
        type: string
        transform: "lambda v: f'daoip-5:privote:grantPool:{v.lower()}' if v else None"
        required: true
      fundsAskedInUSD:
        source: amount
        type: float
        transform: "lambda v: float(v) if v else 0.0"
        required: true
      fundsAsked:
        source: amount
        type: json
        transform: "lambda v: [{'currency':'USD','amount':float(v)}] if v else []"
        required: true
      fundsApproved:
        source: amount
        type: json
        transform: "lambda v: [{'currency':'USD','amount':float(v)}] if v else []"
        required: true
      payoutAddress:
        source: tally_id
        type: json
        transform: "lambda v: {'address': v} if v else None"
        required: true
      payouts:
        source: amount
        type: json
        transform: "lambda v: [{'currency':'USD','amount':float(v)}] if v else []"
        required: true
      fundsApprovedInUSD:
        source: amount
        type: float
        transform: "lambda v: float(v) if v else 0.0"
        required: true
      status:
        source: "approved"
        type: enum
        allowed: [ "pending", "approved", "rejected" ]
        transform: "lambda v: v"
        required: true
      socials:
        source: null
        type: json
        transform: "lambda _: []"
        required: true
      createdAt:
        source: null
        type: datetime
        required: true
        transform: "lambda _: '2025-10-21T00:00:01.000Z'"

    extensions:
      io.privote:
        claimTallyId:
          source: tally_id
          type: string
        pollId:
          source: tally_poll_id
          type: string
        depositPoll:
          source: tally_poll_pollId
          type: string
        fundingSources:
          source: amount
          type: json
          transform: "lambda v: {'claimAmount': float(v) if v else 0.0}"

meta:
  daoip_version: 5
  author: "Rashmi V. Abbigeri <rashmi@metagov.org>"
  mapping_strategy: "Yamale-valid single-table schemas with cross-table enrichment via extensions."
  compatible_with:
  - "opengrants-silver-pipeline>=0.3.4"
  validation_rules:
    json_fields_must_parse: true
    id_format: "daoip-5:privote"
    required_fields:
    - id
    - name
    - projectId
    - grantPoolId
    - fundsApprovedInUSD
