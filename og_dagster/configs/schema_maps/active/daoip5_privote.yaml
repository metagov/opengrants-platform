# ============================================================
# DAOIP-5 Unified Schema Map — Privote (GG24 Privacy Round)
# ============================================================

manifest:
  schema_name: daoip5_privote
  version: 1.4.0
  source_system: "Privote Onchain Registry (Arbitrum)"
  last_updated: "2025-11-06T19:30:00Z"
  description: "DAOIP-5 compliant normalization for Privote GG24 Quadratic Funding Round"

schemas:

  # ------------------------------------------------------------
  # PROJECTS
  # ------------------------------------------------------------
  projects:
    table: "privote.bronze_privote_metadata_urls"
    target_table: silver_privote_projects
    fields:
      id:
        source: recipient_index
        type: string
        transform: "lambda v: f'daoip-5:privote:project:{v}' if v else None"
        required: true
      name:
        source: metadata_name
        type: string
        required: true
      description:
        source: metadata_bio
        type: string
        required: false
      contentURI:
        source: metadata_url
        type: string
        required: false
      image:
        source: metadata_profileImageUrl
        type: string
        required: false
      coverImage:
        source: null
        type: string
        transform: "lambda _: 'https://example.com/cover.jpg'"
        required: true
      email:
        source: null
        type: string
        transform: "lambda _: 'contact@example.com'"
        required: true
      socials:
        source: metadata_websiteUrl
        type: json
        transform: "lambda v: [{'platform': 'website', 'url': v}] if v else []"
        required: false
      membersURI:
        source: null
        type: string
        transform: "lambda _: 'https://example.com/members'"
        required: true
      attestationIssuersURI:
        source: null
        type: json
        transform: "lambda _: []"
        required: true
      relevantTo:
        source: null
        type: json
        transform: "lambda _: []"
        required: true
      licenseURI:
        source: null
        type: string
        transform: "lambda _: 'https://example.com/license'"
        required: true

    extensions:
      io.privote:
        initialized:
          source: initialized
          type: boolean
          required: false

        # -------------------------
        # RECIPIENT IDENTIFIERS
        # -------------------------
        recipientId:
          source: recipient_id
          type: string
          required: false
        payout:
          source: payout
          type: string
          required: false
        deleted:
          source: deleted
          type: boolean
          required: false

        # -------------------------
        # REGISTRY CONTEXT
        # -------------------------
        registryId:
          source: registry_id
          type: string
          required: false
        registryMetadataUrl:
          source: registry_metadata_url
          type: string
          required: false
        registryPollId:
          source: registry_poll_id
          type: string
          required: false
        registryPollPollId:
          source: registry_poll_pollId
          type: string
          required: false

        # -------------------------
        # METADATA (fetched from IPFS/URL)
        # -------------------------
        metadataShortBio:
          source: metadata_shortBio
          type: string
          required: false
        metadataBannerImageUrl:
          source: metadata_bannerImageUrl
          type: string
          required: false
        metadataGithub:
          source: metadata_github
          type: string
          required: false
        metadataTwitter:
          source: metadata_twitter
          type: string
          required: false
        metadataContributionDescription:
          source: metadata_contributionDescription
          type: string
          required: false
        metadataImpactDescription:
          source: metadata_impactDescription
          type: string
          required: false
        metadataSubmittedAt:
          source: metadata_submittedAt
          type: datetime
          required: false
        metadataCreator:
          source: metadata_creator
          type: string
          required: false
        metadataPayoutAddress:
          source: metadata_payoutAddress
          type: string
          required: false
        metadataPayout:
          source: metadata_payout
          type: string
          required: false
        metadataImpactCategoryJson:
          source: metadata_impactCategory_json
          type: json
          required: false
        metadataContributionLinksJson:
          source: metadata_contributionLinks_json
          type: json
          required: false
        metadataFundingSourcesJson:
          source: metadata_fundingSources_json
          type: json
          required: false
        metadataRawJson:
          source: metadata_raw_json
          type: json
          required: false

        # -------------------------
        # DERIVED FLAGS
        # -------------------------
        hasMetadataUrl:
          source: has_metadata_url
          type: boolean
          required: false
        hasRegistryMetadata:
          source: has_registry_metadata
          type: boolean
          required: false
        hasPayout:
          source: has_payout
          type: boolean
          required: false
        isNotDeleted:
          source: is_not_deleted
          type: boolean
          required: false
        isInitialized:
          source: is_initialized
          type: boolean
          required: false
        isApprovedApplicant:
          source: is_approved_applicant
          type: boolean
          required: false

  # ------------------------------------------------------------
  # GRANT POOLS
  # ------------------------------------------------------------
  grant_pools:
    table: "privote.bronze_privote_registries"
    target_table: silver_privote_grant_pools
    fields:
      id:
        source: id
        type: string
        transform: "lambda v: f'daoip-5:privote:grantPool:{v.lower()}'"
        required: true
      name:
        source: metadataUrl
        type: string
        transform: "lambda v: 'GG24 Privote Quadratic Funding Round'"
        required: true
      description:
        source: "Privacy-focused quadratic funding round on Arbitrum using MACI"
        type: string
        required: false
      applicationsURI:
        source: metadataUrl
        type: string
        required: true
      totalGrantPoolSizeInUSD:
        source: null
        type: float
        transform: "lambda _: 3500.0 * 3.1145" # ETH price * total ETH
        required: true
      totalGrantPoolSize:
        source: null
        type: json
        transform: "lambda _: json.dumps({'currency': 'USD', 'amount': 3500.0 * 3.1145})"
        required: true
      isOpen:
        source: null
        type: boolean
        transform: "lambda _: False"
        required: true
      closeDate:
        source: null
        type: datetime
        transform: "lambda _: '2025-10-29T23:59:59.000Z'"
        required: true
      image:
        source: null
        type: string
        transform: "lambda _: 'https://example.com/grant-pool.jpg'"
        required: true
      coverImage:
        source: null
        type: string
        transform: "lambda _: 'https://example.com/cover.jpg'"
        required: true
      email:
        source: null
        type: string
        transform: "lambda _: 'grants@example.com'"
        required: true
      grantFundingMechanism:
        source: null
        type: enum
        allowed: [ "Quadratic Funding" ]
        transform: "lambda _: 'Quadratic Funding'"
        required: true
      governanceURI:
        source: null
        type: string
        transform: "lambda _: 'https://example.com/governance'"
        required: true
      attestationIssuersURI:
        source: null
        type: string
        transform: "lambda _: 'https://example.com/attestations'"
        required: true
      requiredCredentials:
        source: null
        type: json
        transform: "lambda _: []"
        required: true

    extensions:
      io.privote:
        chain:
          source: "arbitrum-one"
          type: string
          required: false
        pollId:
          source: poll_id
          type: string
          required: false
        pollPollId:
          source: poll_pollId
          type: string
          required: false

  # ------------------------------------------------------------
  # GRANT APPLICATIONS
  # ------------------------------------------------------------
  grant_applications:
    table:
    - "privote.ui_allocations"
    - "public.bronze_privote_recipients"
    target_table: silver_privote_grant_applications
    join_keys: [ "recipient_index" ]
    fields:
      id:
        source: recipient_index
        type: string
        transform: "lambda v: f'daoip-5:privote:application:{v}'"
        required: true
      name:
        source: project_name
        type: string
        required: true
      grantPoolName:
        source: "GG24 Privote Round"
        type: string
        required: true
      discussionTo:
        source: null
        type: string
        transform: "lambda _: 'https://example.com/discussion'"
        required: true
      licenseURI:
        source: null
        type: string
        transform: "lambda _: 'https://example.com/license'"
        required: true
      isInactive:
        source: null
        type: boolean
        transform: "lambda _: False"
        required: true
      applicationCompletionRate:
        source: null
        type: float
        transform: "lambda _: 100.0"
        required: true
      description:
        source: null
        type: string
        transform: "lambda _: 'Project application for GG24 Privote Round'"
        required: true
      contentURI:
        source: null
        type: string
        transform: "lambda _: 'https://example.com/application'"
        required: true
      projectId:
        source: recipient_index
        type: string
        transform: "lambda v: f'daoip-5:privote:project:{v}'"
        required: true
      grantPoolId:
        source: null
        type: string
        transform: "lambda _: 'daoip-5:privote:grantPool:gg24'"
        required: true
      fundsAskedInUSD:
        source: allocation_eth
        type: float
        transform: "lambda v: float(v) * 3500.0"
        required: true
      fundsAsked:
        source: allocation_eth
        type: json
        transform: "lambda v: {'currency': 'ETH', 'amount': float(v)}"
        required: true
      fundsApproved:
        source: allocation_eth
        type: json
        transform: "lambda v: {'currency': 'ETH', 'amount': float(v)}"
        required: true
      payoutAddress:
        source: null
        type: json
        transform: "lambda _: {'address': '0x0000000000000000000000000000000000000000'}"
        required: true
      fundsApprovedInUSD:
        source: allocation_eth
        type: float
        transform: "lambda v: float(v) * 3500.0"
        required: true
      status:
        source: null
        type: enum
        allowed: [ "pending", "approved", "rejected" ]
        transform: "lambda _: 'approved'"
        required: true
      socials:
        source: null
        type: json
        transform: "lambda _: []"
        required: true
      createdAt:
        source: null
        type: datetime
        transform: "lambda _: '2025-10-14T00:00:01.000Z'"
        required: true
      payouts:
        source: null
        type: json
        transform: "lambda _: []"
        required: true

    extensions:
      io.privote:
        rank:
          source: rank
          type: integer
          required: false
        votes:
          source: votes
          type: integer
          required: false

meta:
  daoip_version: 5
  author: "Rashmi V. Abbigeri <rashmi@metagov.org>"
  mapping_strategy: "Yamale-valid single-table schemas with cross-table enrichment via extensions"
  compatible_with:
  - "opengrants-silver-pipeline>=0.3.4"
  validation_rules:
    json_fields_must_parse: true
    id_format: "daoip-5:privote"
    required_fields:
    - id
    - name
    - projectId
    - grantPoolId
    - fundsApprovedInUSD
