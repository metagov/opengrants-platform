# ============================================================
# DAOIP-5 Unified Schema Map — Giveth (Strict Compliance)
# ============================================================

manifest:
  schema_name: daoip5_giveth
  version: 1.0.8
  source_system: "Giveth Mainnet API"
  last_updated: "2025-11-03T15:07:56Z"
  description: >
    Strict DAOIP-5-compliant schema mapping for Giveth grant rounds and projects. This schema preserves interoperability across DAOIP-based ecosystems while  allowing custom metadata through x-giveth extensions.

schemas:

  # ----------------------------------------------------------
  # DAOIP-5: GrantPool Schema (Rounds)
  # ----------------------------------------------------------
  grant_pools:
    table: bronze_giveth_qf_rounds
    target_table: silver_giveth_rounds

    fields:
      id:
        source: qfRound_id
        type: string
        required: true
        transform: "lambda v: f'daoip-5:giveth:grantPool:{v}' if v else None"
      name:
        source: qfRound_name
        type: string
        required: true
      description:
        source: qfRound_description
        type: string
      grantFundingMechanism:
        source: null
        type: enum
        allowed:
        - "Quadratic Funding"
        - "Direct Grants"
        - "Retro Funding"
        - "Streaming Quadratic Funding"
        - "Bounties"
        - "Delegated Domain Allocation"
        - "Impact Attestations"
        transform: "lambda _: 'Quadratic Funding'"
      isOpen:
        source: qfRound_isActive
        type: boolean
      closeDate:
        source: qfRound_endDate
        type: datetime
      totalGrantPoolSizeInUSD:
        source: qfRound_allocatedFundUSD
        type: float
        required: true
      image:
        source: qfRound_bannerBgImage
        type: string
      applicationsURI:
        source: null
        type: string
        description: >
          Not provided by Giveth API — left null for now.

    extensions:
      io.giveth:
        uniqueDonors:
          source: uniqueDonors
          type: integer
        donationsCount:
          source: donationsCount
          type: integer
        allDonationsUsdValue:
          source: allDonationsUsdValue
          type: float
        matchingPool:
          source: matchingPool
          type: integer
        allocatedTokenSymbol:
          source: qfRound_allocatedTokenSymbol
          type: string
        allocatedTokenChainId:
          source: qfRound_allocatedTokenChainId
          type: integer
        allocatedFundUSDPreferred:
          source: qfRound_allocatedFundUSDPreferred
          type: boolean
        minimumPassportScore:
          source: qfRound_minimumPassportScore
          type: integer
        clusterMatchingSyncAt:
          source: qfRound_clusterMatchingSyncAt
          type: datetime
        isDataAnalysisDone:
          source: qfRound_isDataAnalysisDone
          type: boolean
        eligibleNetworks:
          source: qfRound_eligibleNetworks
          type: string
        allocatedFund:
          source: qfRound_allocatedFund
          type: integer
          description: "Original allocated fund amount in native token"
        beginDate:
          source: qfRound_beginDate
          type: datetime
          description: "Round start date"
        minMBDScore:
          source: qfRound_minMBDScore
          type: integer
          description: "Minimum MBD score requirement"
        minimumValidUsdValue:
          source: qfRound_minimumValidUsdValue
          type: float
          description: "Minimum USD value for valid donations"
        slug:
          source: qfRound_slug
          type: string
          description: "URL slug for the round"
        sponsorsImgs:
          source: qfRound_sponsorsImgs
          type: json
          description: "Sponsor images array"
          transform: "lambda v: json.loads(v) if v and isinstance(v, str) else v"
        title:
          source: qfRound_title
          type: string
        displaySize:
          source: qfRound_displaySize
          type: integer
        maximumReward:
          source: qfRound_maximumReward
          type: float
        qfStrategy:
          source: qfRound_qfStrategy
          type: string
        bannerFull:
          source: qfRound_bannerFull
          type: string
        bannerMobile:
          source: qfRound_bannerMobile
          type: string
        hubCardImage:
          source: qfRound_hubCardImage
          type: string

  # ----------------------------------------------------------
  # DAOIP-5: Project Schema (Projects)
  # ----------------------------------------------------------
  projects:
    table: bronze_giveth_projects
    target_table: silver_giveth_projects

    fields:
      id:
        source: id
        type: string
        required: true
        transform: "lambda v: f'daoip-5:giveth:project:{v}' if v else None"
      name:
        source: title
        type: string
        required: true
      description:
        source: description
        type: string
      contentURI:
        source: projectUrl
        type: string
      email:
        source: contacts
        type: json
        transform: "lambda v: json.loads(v) if v and isinstance(v, str) else v"
        json_schema:
          type: array
          items:
            type: object
            properties:
              url: { type: string, format: "email" }
            required: [ "url" ]
      membersURI:
        source: website
        type: string
      attestationIssuersURI:
        source: null
        type: string
      image:
        source: image
        type: string
      coverImage:
        source: null
        type: string
      licenseURI:
        source: null
        type: string
      socials:
        source: socialProfiles
        type: json
        transform: "lambda v: json.loads(v) if v and isinstance(v, str) else v"
        json_schema:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              link: { type: string, format: "uri" }
              socialNetwork: { type: string }
              isVerified: { type: boolean }

    extensions:
      io.giveth:
        verified:
          source: verified
          type: boolean
        verificationStatus:
          source: verificationStatus
          type: string
        totalDonations:
          source: totalDonations
          type: float
        countUniqueDonors:
          source: countUniqueDonors
          type: integer
        impactLocation:
          source: impactLocation
          type: string
        walletAddress:
          source: walletAddress
          type: string
        campaigns:
          source: campaigns
          type: json
          transform: "lambda v: json.loads(v) if v and isinstance(v, str) else v"
        reviewStatus:
          source: reviewStatus
          type: string
        isGivbackEligible:
          source: isGivbackEligible
          type: boolean
        traceCampaignId:
          source: traceCampaignId
          type: string
        totalTraceDonations:
          source: totalTraceDonations
          type: float
        adminUserId:
          source: adminUserId
          type: integer
        addresses:
          source: addresses
          type: json
          transform: "lambda v: json.loads(v) if v and isinstance(v, str) else v"
        adminJsBaseUrl:
          source: adminJsBaseUrl
          type: string
        anchorContracts:
          source: anchorContracts
          type: json
          transform: "lambda v: json.loads(v) if v and isinstance(v, str) else v"
        balance:
          source: balance
          type: integer
        categories:
          source: categories
          type: json
          transform: "lambda v: json.loads(v) if v and isinstance(v, str) else v"
        changeId:
          source: changeId
          type: string
        coOrdinates:
          source: coOrdinates
          type: json
          transform: "lambda v: json.loads(v) if v and isinstance(v, str) else v"
        countUniqueDonorsForActiveQfRound:
          source: countUniqueDonorsForActiveQfRound
          type: integer
        creationDate:
          source: creationDate
          type: datetime
        descriptionSummary:
          source: descriptionSummary
          type: string
        donations:
          source: donations
          type: json
          transform: "lambda v: json.loads(v) if v and isinstance(v, str) else v"
        estimatedMatching:
          source: estimatedMatching
          type: json
          transform: "lambda v: json.loads(v) if v and isinstance(v, str) else v"
        featuredUpdate:
          source: featuredUpdate
          type: json
          transform: "lambda v: json.loads(v) if v and isinstance(v, str) else v"
        giveBacks:
          source: giveBacks
          type: boolean
        givingBlocksId:
          source: givingBlocksId
          type: string
        isImported:
          source: isImported
          type: boolean
        latestUpdateCreationDate:
          source: latestUpdateCreationDate
          type: datetime
        listed:
          source: listed
          type: boolean
        organization:
          source: organization
          type: json
          transform: "lambda v: json.loads(v) if v and isinstance(v, str) else v"
        prevStatusId:
          source: prevStatusId
          type: string
        projectEstimatedMatchingView:
          source: projectEstimatedMatchingView
          type: json
          transform: "lambda v: json.loads(v) if v and isinstance(v, str) else v"
        projectVerificationForm:
          source: projectVerificationForm
          type: json
          transform: "lambda v: json.loads(v) if v and isinstance(v, str) else v"
        qfRounds:
          source: qfRounds
          type: json
          transform: "lambda v: json.loads(v) if v and isinstance(v, str) else v"
        qualityScore:
          source: qualityScore
          type: integer
        reactions:
          source: reactions
          type: json
          transform: "lambda v: json.loads(v) if v and isinstance(v, str) else v"
        slug:
          source: slug
          type: string
        slugHistory:
          source: slugHistory
          type: json
          transform: "lambda v: json.loads(v) if v and isinstance(v, str) else v"
        socialMedia:
          source: socialMedia
          type: json
          transform: "lambda v: json.loads(v) if v and isinstance(v, str) else v"
        status:
          source: status
          type: json
          transform: "lambda v: json.loads(v) if v and isinstance(v, str) else v"
        statusHistory:
          source: statusHistory
          type: json
          transform: "lambda v: json.loads(v) if v and isinstance(v, str) else v"
        stripeAccountId:
          source: stripeAccountId
          type: string
        sumDonationValueUsdForActiveQfRound:
          source: sumDonationValueUsdForActiveQfRound
          type: float
        totalProjectUpdates:
          source: totalProjectUpdates
          type: integer
        totalReactions:
          source: totalReactions
          type: integer
        updatedAt:
          source: updatedAt
          type: datetime
        verificationFormStatus:
          source: verificationFormStatus
          type: string
        website:
          source: website
          type: string
        youtube:
          source: youtube
          type: string

meta:
  daoip_version: 5
  author: "Rashmi V. Abbigeri <rashmi@metagov.org>"
  mapping_strategy: "DAOIP-5 compliant + x-giveth extensions"
  compatible_with: [ "opengrants-silver-pipeline>=0.3.0" ]
  validation_rules:
    json_fields_must_parse: true
    json_schema_enforced: true
    id_format: "daoip-5:giveth"
    enum_enforced: true
    required_fields: [ "id", "name", "description", "totalGrantPoolSizeInUSD" ]
