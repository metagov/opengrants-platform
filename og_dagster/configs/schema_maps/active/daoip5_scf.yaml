# ============================================================
# DAOIP-5 Unified Schema Map — Stellar Community Fund (SCF)
# Version: 1.0.11 — Fix image URL extraction; NULL for empty attestationIssuersURI/relevantTo; unify all extensions to org.stellar.communityfund
# Generated: 2025-11-20
# ============================================================

manifest:
  schema_name: daoip5_scf
  version: "1.0.11"
  source_system: "Stellar Community Fund (Airtable API)"
  last_updated: "2025-11-20T00:00:00Z"
  description: >
    DAOIP-5 compliant mapping for SCF grants. Exact bronze column names used. Awarded amounts (USD) are canonical for DAOIP fields; XLM payment amounts are kept in extensions for auditing / separate conversion later.

schemas:

  # ------------------------------------------------------------
  # PROJECTS (bronze_scf_projects)
  # ------------------------------------------------------------
  projects:
    table: bronze_scf_projects
    target_table: silver_scf_projects

    fields:
      id:
        source: "Title"
        type: string
        required: true
        transform: |
          lambda v: f"daoip-5:scf:project:{v.strip().lower().replace(' ', '_')}" if v and str(v).strip() else None

      name:
        source: "Title"
        type: string
        required: true

      description:
        source: "Description"
        type: string
        required: true
        transform: |
          lambda v: v.strip() if v and str(v).strip() else "No description provided."

      contentURI:
        source: "Website"
        type: string

      image:
        source: "Thumbnail"
        type: string
        transform: |
          lambda v: v.split('(', 1)[1].split(')')[0].strip() if v and '(' in str(v) else (v if v else None)

      coverImage:
        source: null
        type: string
        required: true
        transform: "lambda _: ''"

      email:
        source: null
        type: string
        required: true
        transform: "lambda _: ''"

      socials:
        source:
        - "Github"
        - "Discord"
        - "X"
        - "LinkedIn"
        - "Website"
        type: json
        required: true
        transform: |
          lambda Github, Discord, X, LinkedIn, Website: [
            {"platform":"GitHub","url":Github} if Github and str(Github).strip() else None,
            {"platform":"Discord","url":Discord} if Discord and str(Discord).strip() else None,
            {"platform":"X","url":X} if X and str(X).strip() else None,
            {"platform":"LinkedIn","url":LinkedIn} if LinkedIn and str(LinkedIn).strip() else None,
            {"platform":"Website","url":Website} if Website and str(Website).strip() else None
          ]

      membersURI:
        source: null
        type: string
        required: true
        transform: "lambda _: ''"

      attestationIssuersURI:
        source: null
        type: json
        required: false
        transform: "lambda _: []"

      relevantTo:
        source: null
        type: json
        required: false
        transform: "lambda _: []"

      licenseURI:
        source: null
        type: string
        required: true
        transform: "lambda _: ''"

    extensions:
      org.stellar.communityfund:
        integrationStatus:
          source: "Integration Status"
          type: string

        category:
          source: "Category"
          type: string

        website:
          source: "Website"
          type: string

        totalAwardedUSD:
          source: "Total Awarded"
          type: float
          transform: |
            lambda v: float(v.replace('$','').replace('USD','').replace(',','').strip()) if v and str(v).strip() else 0.0

        totalPaidUSD:
          source: "Total Paid"
          type: float
          transform: |
            lambda v: float(v.replace('$','').replace('USD','').replace(',','').strip()) if v and str(v).strip() else 0.0

        totalPaidXLM:
          source: null
          type: float
          transform: "lambda _: 0.0"

        regionsOfOperation:
          source: "Regions of Operation"
          type: string

        submissionsCount:
          source: "Submissions"
          type: integer
          transform: "lambda v: int(v) if v and str(v).strip().isdigit() else 0"

        awardedSubmissionsCount:
          source: "Awarded Submissions"
          type: integer
          transform: "lambda v: int(v) if v and str(v).strip().isdigit() else 0"

        submissionURLAll:
          source: "Submission URL (from All Submissions)"
          type: string

        submissionURLAwarded:
          source: "Submission URL (from Awarded Submissions)"
          type: string

        roundFromSubmissions:
          source: "Round (from Submissions)"
          type: string

        roundFromAwardedSubmissions:
          source: "Round (from Awarded Submissions)"
          type: string

        openSource:
          source: "Open-Source?"
          type: boolean
          transform: "lambda v: str(v).lower() in ['yes','true','1'] if v else False"

        github:
          source: "Github"
          type: string

        discord:
          source: "Discord"
          type: string

        x:
          source: "X"
          type: string

        linkedin:
          source: "LinkedIn"
          type: string

        analytics:
          source: "Analytics"
          type: string

        auditReportURI:
          source: "Public Audit Report (from Audits) (from Audit Bank)"
          type: string

        teamDescription:
          source: "Team Description"
          type: string

        sorobanUsed:
          source: "Soroban?"
          type: boolean
          transform: "lambda v: str(v).lower() in ['yes','true','1'] if v else False"

        thumbnail:
          source: "Thumbnail"
          type: string

        isActive:
          source: "Active"
          type: boolean
          transform: "lambda v: str(v).lower() in ['yes','true','1','active'] if v else False"

        projectURL:
          source: "Project URL"
          type: string

        roundFromSubmissions2:
          source: "Round (from Submissions) 2"
          type: string

  # ------------------------------------------------------------
  # GRANT APPLICATIONS (bronze_scf_submissions)
  # ------------------------------------------------------------
  grant_applications:
    table: bronze_scf_submissions
    target_table: silver_scf_grant_applications

    fields:
      id:
        source: "Submission / Project"
        type: string
        required: true
        transform: |
          lambda v: f"daoip-5:scf:application:{v.strip().lower().replace(' ', '_')}" if v and str(v).strip() else None

      name:
        source: "Submission Title"
        type: string
        required: true

      grantPoolName:
        source: "Round"
        type: string
        required: true

      createdAt:
        source: null
        type: datetime
        transform: "lambda _: '2025-01-01T00:00:00Z'"

      description:
        source: "One-Sentence-Description"
        type: string
        required: true
        transform: |
          lambda v: v.strip() if v and str(v).strip() else "No description provided."

      contentURI:
        source: "Submission URL"
        type: string

      projectId:
        source: "Project"
        type: string
        transform: |
          lambda v: f"daoip-5:scf:project:{v.strip().lower().replace(' ', '_')}" if v and str(v).strip() else None

      grantPoolId:
        source: "Round"
        type: string
        required: true
        transform: |
          lambda v: f"daoip-5:scf:grantPool:{v.strip().lower().replace(' ', '_')}" if v and str(v).strip() else None

      discussionTo:
        source: null
        type: string
        required: true
        transform: "lambda _: ''"

      licenseURI:
        source: null
        type: string
        required: true
        transform: "lambda _: ''"

      isInactive:
        source: null
        type: boolean
        required: true
        transform: "lambda _: False"

      applicationCompletionRate:
        source: null
        type: float
        required: true
        transform: "lambda _: 0.0"

      fundsAskedInUSD:
        source: "Total Awarded (USD)"
        type: float
        required: true
        transform: |
          lambda v: float(v.replace('$','').replace('USD','').replace(',','').strip()) if v and str(v).strip() else 0.0

      fundsAsked:
        source: "Total Awarded (USD)"
        type: json
        required: true
        transform: |
          lambda v: [{"amount": float(v.replace('$','').replace('USD','').replace(',','').strip()) if v and str(v).strip() else 0.0, "token":"USD"}]

      fundsApproved:
        source: "Total Awarded (USD)"
        type: json
        required: true
        transform: |
          lambda v: [{"amount": float(v.replace('$','').replace('USD','').replace(',','').strip()) if v and str(v).strip() else 0.0, "token":"USD"}]

      fundsApprovedInUSD:
        source: "Total Awarded (USD)"
        type: float
        required: true
        transform: |
          lambda v: float(v.replace('$','').replace('USD','').replace(',','').strip()) if v and str(v).strip() else 0.0

      payoutAddress:
        source: null
        type: json
        required: true
        transform: "lambda _: {}"

      payouts:
        source: null
        type: json
        required: true
        transform: "lambda _: []"

      socials:
        source: null
        type: json
        required: true
        transform: "lambda _: []"

      status:
        source: "Total Awarded (USD)"
        type: enum
        allowed:
        - pending
        - approved
        transform: |
          lambda v: "approved" if v and str(v).strip() and v.strip() not in ["0","$0",""] else "pending"

    extensions:
      org.stellar.communityfund:
        submissionProject:
          source: "Submission / Project"
          type: string

        submissionTitle:
          source: "Submission Title"
          type: string

        round:
          source: "Round"
          type: string

        project:
          source: "Project"
          type: string

        category:
          source: "Category (from Project)"
          type: string

        submissionURL:
          source: "Submission URL"
          type: string

        trancheCompletionPercent:
          source: "Tranche Completion %"
          type: float
          transform: "lambda v: float(v) if v is not None else 0.0"

        totalAwardedUSD:
          source: "Total Awarded (USD)"
          type: float
          transform: |
            lambda v: float(v.replace('$','').replace('USD','').replace(',','').strip()) if v and str(v).strip() else 0.0

        totalPaidUSD:
          source: "Total Paid (USD)"
          type: float
          transform: |
            lambda v: float(v.replace('$','').replace('USD','').replace(',','').strip()) if v and str(v).strip() else 0.0

        totalPaidXLM:
          source: "Total Paid (XLM)"
          type: float
          transform: "lambda v: float(str(v).replace(',', '')) if v is not None and str(v).strip() else 0.0"

        mostRecentPaymentDate:
          source: "Most Recent Payment Date"
          type: string

        awardType:
          source: "Award Type"
          type: string

        oneSentenceDescription:
          source: "One-Sentence-Description"
          type: string

        productsAndServices:
          source: "Products & Services"
          type: string

        technicalArchitecture:
          source: "Technical Architecture"
          type: string

        successCriteria:
          source: "Success Criteria"
          type: string

        website:
          source: "Website"
          type: string

        code:
          source: "Code"
          type: string

        video:
          source: "Video"
          type: string

        useSoroban:
          source: "Use Soroban?"
          type: boolean
          transform: "lambda v: str(v).lower() in ['yes','true','1'] if v else False"

        goToMarketPlan:
          source: "Go-To-Market Plan"
          type: string

        tractionEvidence:
          source: "Traction Evidence"
          type: string

        tranche1Deliverables:
          source: "Tranche 1 - Deliverables"
          type: string

        tranche2Testnet:
          source: "Tranche 2 - Testnet"
          type: string

        tranche3Mainnet:
          source: "Tranche 3 - Mainnet"
          type: string

        teamMembers:
          source: "Team Members"
          type: string

        thumbnail:
          source: "Thumbnail"
          type: string

        linkedin:
          source: "LinkedIn (from Project)"
          type: string

        x:
          source: "X (from Project)"
          type: string

        discord:
          source: "Discord (from Project)"
          type: string

        pitchDeck:
          source: "Pitch Deck (from Project)"
          type: string

        awardCompletionDurationWeeks:
          source: "Award Completion Duration (if Mainnet, in Weeks)"
          type: integer
          transform: "lambda v: int(v) if v is not None and str(v).strip().isdigit() else 0"

        trancheCompletion:
          source: "Tranche Completion"
          type: string

        yearFromRound:
          source: "Year (from Round)"
          type: integer
          transform: "lambda v: int(v) if v is not None and str(v).strip().isdigit() else None"

        quarterYearFromRound:
          source: "Quarter, Year (from Round)"
          type: string

  # ------------------------------------------------------------
  # GRANT POOLS (bronze_scf_rounds)
  # ------------------------------------------------------------
  grant_pools:
    table: bronze_scf_rounds
    target_table: silver_scf_grant_pools

    fields:
      id:
        source: "Name"
        type: string
        required: true
        transform: |
          lambda v: f"daoip-5:scf:grantPool:{v.strip().lower().replace(' ', '_')}" if v and str(v).strip() else None

      name:
        source: "Name"
        type: string
        required: true

      description:
        source: "Description"
        type: string
        required: true
        transform: |
          lambda v: v.strip() if v and str(v).strip() else "No description provided."

      applicationsURI:
        source: "Round URL"
        type: string

      totalGrantPoolSizeInUSD:
        source: "Total Awarded (USD)"
        type: float
        required: true
        transform: |
          lambda v: float(v.replace('$','').replace('USD','').replace(',','').strip()) if v and str(v).strip() else 0.0

      isOpen:
        source: "Submission Close Date"
        type: boolean
        transform: "lambda v: __import__('datetime').datetime.strptime(v.strip(), '%B %d, %Y').date() >= __import__('datetime').date.today() if v and str(v).strip() else False"

      closeDate:
        source: "Submission Close Date"
        type: datetime

      image:
        source: "Image"
        type: string
        transform: |
          lambda v: v.split('(', 1)[1].split(')')[0].strip() if v and '(' in str(v) else (v if v else None)

      coverImage:
        source: null
        type: string
        required: true
        transform: "lambda _: ''"

      email:
        source: null
        type: string
        required: true
        transform: "lambda _: ''"

      grantFundingMechanism:
        source: "Type"
        type: enum
        allowed:
        - quadratic_funding
        - direct_grants
        - retroactive_funding
        - rfp
        - other
        transform: |
          lambda v: "direct_grants" if v and "direct" in str(v).lower() else "other"

      governanceURI:
        source: null
        type: string
        required: true
        transform: "lambda _: ''"

      attestationIssuersURI:
        source: null
        type: string
        required: true
        transform: "lambda _: ''"

      requiredCredentials:
        source: null
        type: json
        required: true
        transform: "lambda _: []"

      totalGrantPoolSize:
        source: "Total Awarded (USD)"
        type: json
        required: true
        transform: |
          lambda v: [{"amount": float(v.replace('$','').replace('USD','').replace(',','').strip()) if v and str(v).strip() else 0.0, "token":"USD"}]

    extensions:
      org.stellar.communityfund:
        quarterYear:
          source: "Quarter, Year"
          type: string

        phase:
          source: "Phase"
          type: string

        appliedProjectAbstracts:
          source: "Applied Project Abstracts"
          type: integer
          transform: "lambda v: int(v) if v is not None and str(v).strip().isdigit() else 0"

        appliedSubmissions:
          source: "Applied Submissions"
          type: integer
          transform: "lambda v: int(v) if v is not None and str(v).strip().isdigit() else 0"

        awardedSubmissions:
          source: "Awarded Submissions"
          type: integer
          transform: "lambda v: int(v) if v is not None and str(v).strip().isdigit() else 0"

        percentAwarded:
          source: "% Awarded"
          type: float
          transform: "lambda v: float(v.replace('%','').strip()) if v and str(v).strip() else 0.0"

        totalAwardedUSD:
          source: "Total Awarded (USD)"
          type: float
          transform: |
            lambda v: float(v.replace('$','').replace('USD','').replace(',','').strip()) if v and str(v).strip() else 0.0

        totalPaidUSD:
          source: "Total Paid (USD)"
          type: float
          transform: |
            lambda v: float(v.replace('$','').replace('USD','').replace(',','').strip()) if v and str(v).strip() else 0.0

        totalPaidXLM:
          source: "Total Paid (XLM)"
          type: float
          transform: "lambda v: float(str(v).replace(',', '')) if v is not None and str(v).strip() else 0.0"

        averageAwardedUSD:
          source: "Average Awarded in USD"
          type: float
          transform: "lambda v: float(v.replace('$','').replace(',','').strip()) if v and str(v).strip() else 0.0"

        votersNumber:
          source: "Voters Number"
          type: float

        roundURL:
          source: "Round URL"
          type: string

        submissions:
          source: "Submissions"
          type: string

        projectFromSubmissions:
          source: "Project (from Submissions)"
          type: string

        type:
          source: "Type"
          type: string

        submissionOpenDate:
          source: "Submission Open Date"
          type: string

        submissionCloseDate:
          source: "Submission Close Date"
          type: string

        image:
          source: "Image"
          type: string
          transform: |
            lambda v: v.split('(', 1)[1].split(')')[0].strip() if v and '(' in str(v) else (v if v else None)

        scfVersion:
          source: "SCF Version"
          type: string

        roundRecap:
          source: "Round Recap"
          type: string

        year:
          source: "Year"
          type: integer
          transform: "lambda v: int(v) if v is not None and str(v).strip().isdigit() else 2025"

        communityVoteOpenDate:
          source: "Community Vote Open Date"
          type: string

        communityVoteCloseDate:
          source: "Community Vote Close Date"
          type: string

        projectPitches:
          source: "Project Pitches"
          type: string

        initialReviewOpenDate:
          source: "Initial Review Open Date"
          type: string

        initialReviewCloseDate:
          source: "Initial Review Close Date"
          type: string

        awardSubmissionOpenDate:
          source: "Award Submission Open Date"
          type: string

        awardSubmissionCloseDate:
          source: "Award Submission Close Date"
          type: string

        panelReviewOpenDate:
          source: "Panel Review Open Date"
          type: string

        panelReviewCloseDate:
          source: "Panel Review Close Date"
          type: string

        notificationOpenDate:
          source: "Notification and Award Distribution Open Date"
          type: string

        notificationCloseDate:
          source: "Notification and Award Distribution Close Date"
          type: string

        cohortOpenDate:
          source: "Cohort Open Date"
          type: string

        cohortCloseDate:
          source: "Cohort Close Date"
          type: string

meta:
  daoip_version: 5
  author: "Rashmi V. Abbigeri <rashmi@metagov.org>"
  mapping_strategy: "DAOIP-5 compliant; exact bronze column mapping; USD canonical for awards"
  validation_rules:
    json_fields_must_parse: true
    id_format: "daoip-5:scf"
    required_fields:
    - id
    - name
    - projectId
    - grantPoolId
    - fundsApprovedInUSD