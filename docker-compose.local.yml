services:
  postgres:
    container_name: postgres
    image: postgres:16
    restart: always
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: opengrants
  
  dagster-readonly:
    container_name: dagster-readonly
    build:
      context: .
      dockerfile: og_dagster/Dockerfile
    restart: unless-stopped
    ports:
      - '3001:3000'
    volumes:
      - ./og_dagster:/app
      - ./dbt_project:/app/dbt_project
      - ./duckdb:/data/duckdb
      - ./raw_data:/app/raw_data
    environment:
      - DAGSTER_HOME=/app
      - DATABASE_URL="${DATABASE_URL}"
      - DUCKDB_CACHE_PATH=/data/duckdb/local.duckdb
    env_file:
      - .env
    command:
      - /bin/sh
      - -c
      - |
        echo "=================================================="
        echo "🚀 Dagster webserver starting... in 2mins. Port Mapped 3001:3000"
        echo "📊 Access it at: http://localhost:3001"
        echo "=================================================="
        exec dagster-webserver --read-only -h 0.0.0.0 -p 3000 -w workspace.yaml

  dagster:
    container_name: dagster
    build:
      context: .
      dockerfile: og_dagster/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - '3000:3000'
    volumes:
      - ./og_dagster:/app
      - ./dbt_project:/app/dbt_project
      - ./duckdb:/data/duckdb
      - ./raw_data:/app/raw_data
      - /home/torch/opengrants-platform/raw_data/Gitcoin:/app/raw_data/Gitcoin
    environment:
      - DAGSTER_HOME=/app
      - DUCKDB_CACHE_PATH=/app/duckdb/data/local.duckdb
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-opengrants}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_SSL=${POSTGRES_SSL:-}
      - DAGSTER_METADATA_DB_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/opengrants
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://postgres:postgres@postgres:5432/opengrants}
      - GITCOIN2_RAW_DATA_DIR=/app/raw_data/Gitcoin/17_March_2026
      - DESTINATION__POSTGRES__CREDENTIALS__HOST=${POSTGRES_HOST:-postgres}
      - DESTINATION__POSTGRES__CREDENTIALS__USERNAME=${POSTGRES_USER:-postgres}
      - DESTINATION__POSTGRES__CREDENTIALS__PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DESTINATION__POSTGRES__CREDENTIALS__DATABASE=${POSTGRES_DB:-opengrants}
      - DESTINATION__POSTGRES__CREDENTIALS__PORT=${POSTGRES_PORT:-5432}
    env_file:
      - .env.local
    command:
      - /bin/sh
      - -c
      - |
        if echo "$POSTGRES_HOST" | grep -q "digitalocean"; then
          echo "=================================================="
          echo "⚡ Connecting to DO Managed Postgres"
          echo "   Host: $POSTGRES_HOST"
          echo "   DB:   $POSTGRES_DB"
          echo "=================================================="
        else
          echo "=================================================="
          echo "🏠 Connecting to local Postgres"
          echo "   Host: $POSTGRES_HOST"
          echo "   DB:   $POSTGRES_DB"
          echo "=================================================="
        fi
        dbt parse --project-dir /app/dbt_project --profiles-dir /app/dbt_project 2>/dev/null || echo 'dbt parse skipped'
        exec dagster dev -h 0.0.0.0 -p 3000 -w workspace.yaml

  dlt:
    container_name: dlt
    build:
      context: ./dlt_pipelines
      dockerfile: Dockerfile
    restart: on-failure
    depends_on:
      - postgres
    volumes:
      - ./dlt_pipelines:/app
      - ./duckdb:/data/duckdb
    env_file:
      - .env.local
    command:
      - python
      - loaders/privote_loader.py

  dbt:
    container_name: dbt
    build:
      context: ./dbt_project
      dockerfile: Dockerfile
    restart: on-failure
    depends_on:
      - postgres
    volumes:
      - ./dbt_project:/app
      - ./duckdb:/data/duckdb
    env_file:
      - .env.local
    environment:
      - DBT_TARGET=dev_postgres
    entrypoint:
      - dbt
    working_dir: /app

volumes:
  postgres_data: null
  duckdb:
    driver: local
