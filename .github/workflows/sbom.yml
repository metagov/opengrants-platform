name: PG Atlas SBOM

on:
  push:
    branches: [master]
  release:
    types: [published]

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: SCF-Public-Goods-Maintenance/pg-atlas-sbom-action@20d2cff7ec9335c43e5e50451dc2576572ff7d49 # v1.0.1
